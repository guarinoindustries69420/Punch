<!DOCTYPE html>
<!--
  PUNCH Time Clock (web edition)
  ================================
  A shared, remote time clock for your team. One file, no server of your own.

  QUICK SETUP (about 10 minutes):
  1. Create a free project at https://supabase.com
  2. In Supabase: SQL Editor -> New query -> paste the contents of
     supabase-setup.sql -> Run. This creates the employees and shifts tables.
  3. In Supabase: Project Settings -> API. Copy the "Project URL" and the
     "anon public" API key.
  4. Paste both into the CONFIG section just below (replace the placeholders).
  5. Upload this file to your website (or GitHub Pages) and share the link.

  Employees open the link on any device, tap their name, enter their PIN,
  and clock in. The manager dashboard (master PIN) sees everyone, live.
-->
<html lang="en">

<style>

:root{

html,body{ min-height:100%; }
body{

}

.pc-glow{ position:fixed; top:-160px; left:50%; transform:translateX(-50%); width:560px; height:420px; pointer-events:none; z-index:0;

.pc-brand-mark{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:24px; letter-spacing:.16em; display:block; line-height:1; }

/* ---------- helpers ---------- */
function hashPin(pin){ let h=5381; for(let i=0;i<pin.length;i++) h=(((h<<5)+h)+pin.charCodeAt(i))&0xffffffff; return String(h>>>0); }
function b32decode(s){
  const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  let bits="", out=[];
  s=(s||"").toUpperCase().replace(/=+$/,"").replace(/[^A-Z2-7]/g,"");
  for(const c of s){ bits += A.indexOf(c).toString(2).padStart(5,"0"); }
  for(let i=0;i+8<=bits.length;i+=8){ out.push(parseInt(bits.slice(i,i+8),2)); }
  return new Uint8Array(out);
}
async function totpCodeAt(secret, counter){
  const key = await crypto.subtle.importKey("raw", b32decode(secret), {name:"HMAC", hash:"SHA-1"}, false, ["sign"]);
  const buf = new ArrayBuffer(8); const dv = new DataView(buf);
  dv.setUint32(0, Math.floor(counter/4294967296));
  dv.setUint32(4, counter % 4294967296);
  const sig = new Uint8Array(await crypto.subtle.sign("HMAC", key, buf));
  const off = sig[sig.length-1] & 0x0f;
  const val = ((sig[off]&0x7f)<<24) | (sig[off+1]<<16) | (sig[off+2]<<8) | sig[off+3];
  return String(val % 1000000).padStart(6,"0");
}
async function verifyTotp(input){
  const c = Math.floor(Date.now()/1000/30);
  for(const o of [0,-1,1]){
    if(await totpCodeAt(TOTP_SECRET, c+o) === input) return true;
  }
  return false;
}
const esc = (s)=>String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shiftMs = (s, nowTs)=>(s.clockOut==null?nowTs:s.clockOut)-s.clockIn;
function initials(name){ const p=String(name).trim().split(/\s+/).filter(Boolean); if(!p.length)return "?"; if(p.length===1)return p[0].slice(0,2).toUpperCase(); return (p[0][0]+p[p.length-1][0]).toUpperCase(); }
function fmtHMS(ms){ const t=Math.max(0,Math.floor(ms/1000)); const p=(n)=>String(n).padStart(2,"0"); return p(Math.floor(t/3600))+":"+p(Math.floor((t%3600)/60))+":"+p(t%60); }
function fmtDur(ms){ const m=Math.round(ms/60000); const h=Math.floor(m/60); return h===0? m+"m" : h+"h "+String(m%60).padStart(2,"0")+"m"; }
function money(n){ return "$"+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtClock(ts){ return new Date(ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
function sameDay(a,b){ const x=new Date(a),y=new Date(b); return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate(); }
function startOfWeek(ts){ const x=new Date(ts); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function toLocalInput(ts){ const d=new Date(ts); const p=(n)=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()); }
function deviceLabel(ua){ if(!ua) return "Unknown device"; if(/iPhone|iPad/i.test(ua)) return "iPhone or iPad"; if(/Android/i.test(ua)) return "Android"; if(/Windows/i.test(ua)) return "Windows PC"; if(/Macintosh/i.test(ua)) return "Mac"; return "Other device"; }
function fmtWhen(iso){ const d=new Date(iso); return d.toLocaleDateString([], {month:"short",day:"numeric"})+" "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
function getGeo(){
  return new Promise((res)=>{
    if(!navigator.geolocation){ res(null); return; }
    let done=false;
    const finish=(v)=>{ if(!done){ done=true; res(v); } };
    const t=setTimeout(()=>finish(null), 7000);
    navigator.geolocation.getCurrentPosition(
      (p)=>{ clearTimeout(t); finish({lat:Math.round(p.coords.latitude*1e5)/1e5, lng:Math.round(p.coords.longitude*1e5)/1e5}); },
      ()=>{ clearTimeout(t); finish(null); },
      { enableHighAccuracy:false, timeout:6000, maximumAge:120000 }
    );
  });
}

const $app = ()=>document.getElementById("app");
const activeShift = (shifts)=>shifts.find((s)=>s.clockOut==null)||null;
const totalToday = (shifts, now)=>shifts.filter((s)=>sameDay(s.clockIn,now)).reduce((a,s)=>a+shiftMs(s,now),0);
const totalWeek = (shifts, now)=>{ const w=startOfWeek(now).getTime(); return shifts.filter((s)=>s.clockIn>=w).reduce((a,s)=>a+shiftMs(s,now),0); };
function inPeriod(ts, now){ if(state.period==="all")return true; if(state.period==="today")return sameDay(ts,now); return ts>=startOfWeek(now).getTime(); }
function payBreakdown(shifts, period, now, rate){
  const capMs = OT_WEEKLY_HOURS*3600000;
  const weeks = new Map();
  for(const s of shifts){
    const wk = startOfWeek(s.clockIn).getTime();
    if(!weeks.has(wk)) weeks.set(wk, []);
    weeks.get(wk).push(s);
  }
  const curWk = startOfWeek(now).getTime();
  let ms=0, regMs=0, otMs=0;
  for(const [wk, list] of weeks){
    if(period!=="all" && wk!==curWk) continue;
    if(period==="today"){
      const dayStart = new Date(now); dayStart.setHours(0,0,0,0);
      const before = list.filter((s)=>s.clockIn<dayStart.getTime()).reduce((a,s)=>a+shiftMs(s,now),0);
      const today = list.filter((s)=>sameDay(s.clockIn,now)).reduce((a,s)=>a+shiftMs(s,now),0);
      const reg = Math.min(today, Math.max(0, capMs-before));
      ms+=today; regMs+=reg; otMs+=(today-reg);
    } else {
      const tot = list.reduce((a,s)=>a+shiftMs(s,now),0);
      const reg = Math.min(tot, capMs);
      ms+=tot; regMs+=reg; otMs+=(tot-reg);
    }
  }
  return { ms, regMs, otMs, pay: (regMs/3600000)*rate + (otMs/3600000)*rate*OT_MULTIPLIER };
}

      : '<div class="pc-erow-name">'+esc(e.name)+'<button class="pc-pencil" aria-label="Rename" onclick="event.stopPropagation();app.startName(\''+e.id+'\')">&#9998;</button>'+

    if(state.expanded===e.id){

          + (s.outLat!=null && s.outLng!=null ? ' <a class="pc-geo" target="_blank" rel="noopener" title="Clock-out location" href="https://www.google.com/maps?q='+s.outLat+','+s.outLng+'">&#128205;out</a>' : '');
        drows += '<div class="pc-drow"><span class="pc-drow-date">'+new Date(s.clockIn).toLocaleDateString([], {month:"short",day:"numeric"})+'</span>'+
          '<span class="pc-drow-time">'+fmtClock(s.clockIn)+' &#8594; '+(open?"in progress":fmtClock(s.clockOut))+(pins?' '+pins:'')+'</span>'+
          '<span class="pc-drow-dur" '+(open?('data-livedur data-start="'+s.clockIn+'"'):"")+'>'+fmtDur(shiftMs(s,now))+'</span>'+
          '<button class="pc-edit-ico" aria-label="Edit shift" onclick="app.startShiftEdit(\''+e.id+'\',\''+s.id+'\')">&#9998;</button></div>';
      }
      if(!shifts.length && !adding) drows = '<div class="pc-empty sm">No shifts in this period.</div>';
      if(adding) drows += shiftEditorHTML(false);
      detail = '<div class="pc-erow-detail">'+drows+
        '<div class="pc-detail-actions"><button class="pc-mini" onclick="app.startAddShift(\''+e.id+'\')">+ Add shift</button>'+
        (safePhoto(e.photo)?'<button class="pc-mini" onclick="app.removePhoto(\''+e.id+'\')">Remove photo</button>':"")+
        '<button class="pc-mini danger" onclick="app.deleteEmployee(\''+e.id+'\')">Remove employee</button></div></div>';
    }

    list += '<div class="pc-erow"><div class="pc-erow-main" onclick="app.toggleExpand(\''+e.id+'\')">'+
      avatarHTML(e,"sm")+'<div class="pc-erow-id">'+nameBlock+rateBlock+'</div>'+
      '<div class="pc-erow-fig"><div><div class="pc-erow-pay">'+money(r.pay)+'</div><div class="pc-erow-hrs">'+fmtDur(r.ms)+(r.otMs>0?' <span class="pc-ot-tag">'+fmtDur(r.otMs)+' OT</span>':"")+'</div></div>'+
      '<span class="pc-chev '+(state.expanded===e.id?"open":"")+'">&#9660;</span></div></div>'+detail+'</div>';

  if(!emps.length) list = '<div class="pc-empty">No employees yet. Tap + Add above to create your team.</div>';

  let addForm = "";
  if(state.adminAdd){
    addForm = '<div class="pc-shift-edit">'+
      '<input class="pc-input slim" id="js-aaname" placeholder="Full name" maxlength="40" value="'+esc(state.adminAddName)+'" oninput="app.syncAdminAddName(this.value)" />'+
      '<input class="pc-input slim" placeholder="4-digit PIN for this employee" inputmode="numeric" maxlength="4" value="'+esc(state.adminAddPin)+'" oninput="app.syncAdminAddPin(this.value)" onkeydown="if(event.key===\'Enter\')app.adminCreateEmployee()" />'+
      (state.addErr?('<div class="pc-err-text">'+esc(state.addErr)+'</div>'):"")+
      '<div class="pc-edit-actions"><button class="pc-mini accent" onclick="app.adminCreateEmployee()">'+(state.busy?"Saving\u2026":"Create")+'</button>'+
      '<button class="pc-mini" onclick="app.cancelAdminAdd()">Cancel</button></div></div>';
  }

  $app().innerHTML =
    '<header class="pc-head pc-rise"><div class="pc-brand"><span class="pc-brand-mark">PUNCH</span><span class="pc-brand-sub">manager</span></div>'+
    '<div class="pc-empchip"><span class="pc-avatar sm admin">&#128737;</span><div class="pc-empchip-txt"><span class="pc-empchip-name">CEO</span>'+
    '<button class="pc-signout" onclick="app.signOut()">Sign out</button></div></div></header>'+
    '<div class="pc-seg pc-rise">'+seg+'</div>'+alertCard+
    '<section class="pc-payroll pc-rise"><div class="pc-pr-col"><div class="pc-pr-label">Total Hours</div><div class="pc-pr-val">'+fmtDur(totalHrs*3600000)+'</div></div>'+
    '<div class="pc-pr-div"></div><div class="pc-pr-col"><div class="pc-pr-label">Total Payroll</div><div class="pc-pr-val amber">'+money(totalPay)+'</div></div></section>'+
    (totalOtMs>0?'<div class="pc-ot-note pc-rise">Includes '+fmtDur(totalOtMs)+' of overtime at '+OT_MULTIPLIER+'\u00D7 pay</div>':"")+
    '<section class="pc-card pc-rise"><div class="pc-card-head pc-card-head-row"><span>Team &#183; '+periodLabel+'</span>'+
    '<div class="pc-head-actions"><button class="pc-mini accent" onclick="app.startAdminAdd()">+ Add</button>'+
    '<button class="pc-mini" onclick="app.refreshAdmin()">Refresh</button>'+
    (emps.length?'<button class="pc-mini" onclick="app.exportPayroll()">Payroll</button>':"")+'</div></div>'+addForm+list+'</section>'+
    '<section class="pc-card pc-rise"><div class="pc-card-head pc-card-head-row"><span>Security</span>'+
    '<div class="pc-head-actions">'+
    '<button class="pc-mini '+(state.secTab!=="employee"?"accent":"")+'" onclick="app.setSecTab(\'manager\')">Manager</button>'+
    '<button class="pc-mini '+(state.secTab==="employee"?"accent":"")+'" onclick="app.setSecTab(\'employee\')">Employees</button>'+
    '</div></div>'+secRows+'</section>'+
    '<div class="pc-foot pc-rise">Live view auto-refreshes every 30 seconds. Pay rates require the master PIN.</div>';

  const ni=document.getElementById("js-nameinput"); if(ni){ ni.focus(); }
  const ri=document.getElementById("js-rateinput"); if(ri){ ri.focus(); }
  const ai=document.getElementById("js-aaname"); if(ai && !state.adminAddName && !state.adminAddPin){ ai.focus(); }
}

function shiftEditorHTML(existing){
  return '<div class="pc-shift-edit">'+
    '<label class="pc-dt-row"><span>In</span><input type="datetime-local" class="pc-dt" value="'+esc(state.inDraft)+'" oninput="app.syncIn(this.value)" /></label>'+
    '<label class="pc-dt-row"><span>Out</span><input type="datetime-local" class="pc-dt" value="'+esc(state.outDraft)+'" oninput="app.syncOut(this.value)" /></label>'+
    '<div class="pc-dt-hint">Leave Out empty to keep the shift running.</div>'+
    (state.editErr?('<div class="pc-err-text">'+esc(state.editErr)+'</div>'):"")+
    '<div class="pc-edit-actions"><button class="pc-mini accent" onclick="app.saveShiftEdit()">Save</button>'+
    '<button class="pc-mini" onclick="app.cancelShiftEdit()">Cancel</button>'+
    (existing?'<button class="pc-mini danger" onclick="app.deleteEditingShift()">Delete</button>':"")+'</div></div>';
}

function render(){
  if(!configured){ renderSetup(); return; }
  switch(state.route){
    case "roster": renderRoster(); break;
    case "pin": renderPin(); break;
    case "adminpin": renderAdminPin(); break;
    case "admincode": renderAdminCode(); break;
    case "clock": renderClock(); break;
    case "admin": renderAdmin(); break;
  }
}

/* ---------- actions ---------- */
const app = {
  openManager(){ state.apin=""; state.aErr=false; state.route="adminpin"; render(); },
  openAdminCode(){ state.acode=""; state.acErr=false; state.route="admincode"; render(); },
  async checkCode(){
    let ok=false;
    try{ ok = await verifyTotp(state.acode); }
    catch(e){ console.error(e); banner("This browser blocked the code check. Open the site over https."); }
    if(ok){ dbLogAttempt(true); app.enterAdmin(); }
    else { dbLogAttempt(false); state.acErr=true; render(); setTimeout(()=>{ state.acode=""; state.acErr=false; if(state.route==="admincode")render(); },550); }
  },
  openPin(id){ const e=state.employees.find((x)=>x.id===id); if(!e)return; state.selected=e; state.pin=""; state.pinErr=false; state.route="pin"; render(); },
  back(){ state.route="roster"; state.selected=null; state.pin=""; state.apin=""; state.acode=""; app.loadRoster(); },

  async loadRoster(){
    render();
    try{ state.employees = await dbEmployees(); }catch(e){ netErr(e); }
    if(state.route==="roster") render();
  },

  press(d){
    if(state.route==="pin"){
      if(state.pin.length>=4)return;
      state.pin+=d; render();
      if(state.pin.length===4){
        if(hashPin(state.pin)===state.selected.pinHash){ dbLogAttempt(true, "employee", state.selected.id, state.selected.name); app.signInEmployee(); }
        else { dbLogAttempt(false, "employee", state.selected.id, state.selected.name); state.pinErr=true; render(); setTimeout(()=>{ state.pin=""; state.pinErr=false; if(state.route==="pin")render(); },550); }
      }
    } else if(state.route==="adminpin"){
      if(state.apin.length>=4)return;
      state.apin+=d; render();
      if(state.apin.length===4){
        if(hashPin(state.apin)===MASTER_PIN_HASH){ app.openAdminCode(); }
        else { dbLogAttempt(false); state.aErr=true; render(); setTimeout(()=>{ state.apin=""; state.aErr=false; if(state.route==="adminpin")render(); },550); }
      }
    } else if(state.route==="admincode"){
      if(state.acode.length>=6)return;
      state.acode+=d; render();
      if(state.acode.length===6){ app.checkCode(); }
    }
  },
  del(){
    if(state.route==="pin") state.pin=state.pin.slice(0,-1);
    else if(state.route==="adminpin") state.apin=state.apin.slice(0,-1);
    else if(state.route==="admincode") state.acode=state.acode.slice(0,-1);
    render();
  },
  clearPin(){
    if(state.route==="pin") state.pin="";
    else if(state.route==="adminpin") state.apin="";
    else if(state.route==="admincode") state.acode="";
    render();
  },
  startAdminAdd(){ state.adminAdd=true; state.adminAddName=""; state.adminAddPin=""; state.addErr=""; render(); },
  cancelAdminAdd(){ state.adminAdd=false; state.addErr=""; render(); },
  syncAdminAddName(v){ state.adminAddName=v; },
  syncAdminAddPin(v){ state.adminAddPin=v.replace(/[^0-9]/g,"").slice(0,4); },
  async adminCreateEmployee(){
    const name = state.adminAddName.trim();
    if(!name){ state.addErr="Enter the employee's name."; render(); return; }
    if(!/^\d{4}$/.test(state.adminAddPin)){ state.addErr="PIN must be exactly 4 digits."; render(); return; }
    if(state.busy)return;
    state.busy=true;
    try{
      const e = await dbAddEmployee(name, state.adminAddPin);
      state.employees.push(e);
      state.byEmp[e.id]=[];
      state.adminAdd=false; state.addErr="";
    }catch(err){ netErr(err); }
    state.busy=false; render();
  },

  async deleteEmployee(id){
    const e=state.employees.find((x)=>x.id===id); if(!e)return;
    if(!window.confirm("Remove "+e.name+" and all their recorded hours?"))return;
    try{
      await dbDeleteEmployee(id);
      state.employees=state.employees.filter((x)=>x.id!==id);
      delete state.byEmp[id];
      if(state.expanded===id)state.expanded=null;
    }catch(err){ netErr(err); }
    render();
  },

  async signInEmployee(){
    state.current=state.selected; state.route="clock"; state.shifts=[]; render();
    try{ state.shifts = await dbShiftsFor(state.current.id); }catch(e){ netErr(e); }
    if(state.route==="clock") render();
  },
  signOut(){ state.current=null; state.shifts=[]; state.route="roster"; state.expanded=null; state.shiftEdit=null; state.nameEditId=null; state.rateEditId=null; app.loadRoster(); },

  async clockIn(){
    if(activeShift(state.shifts)||state.busy)return;
    state.busy=true; render();
    const g = await getGeo();
    try{ const s=await dbInsertShift(state.current.id, Date.now(), null, g?{in_lat:g.lat, in_lng:g.lng}:null); state.shifts=[s,...state.shifts]; }
    catch(e){ netErr(e); }
    state.busy=false; render();
  },
  async clockOut(){
    const act=activeShift(state.shifts); if(!act||state.busy)return;
    state.busy=true; render();
    const g = await getGeo();
    try{ const out=Date.now(); await dbUpdateShift(act.id, act.clockIn, out, g?{out_lat:g.lat, out_lng:g.lng}:null); act.clockOut=out; }
    catch(e){ netErr(e); }
    state.busy=false; render();
  },
  async removeShift(id){
    if(!window.confirm("Delete this shift?"))return;
    try{ await dbDeleteShift(id); state.shifts=state.shifts.filter((s)=>s.id!==id); }catch(e){ netErr(e); }
    render();
  },
  async clearAll(){
    if(!window.confirm("Delete all of "+state.current.name+"'s shifts?"))return;
    try{ await dbDeleteShiftsFor(state.current.id); state.shifts=[]; }catch(e){ netErr(e); }
    render();
  },
  exportMyCSV(){
    const rows=[["Employee","Date","Clock In","Clock Out","Hours"]];
    [...state.shifts].sort((a,b)=>a.clockIn-b.clockIn).forEach((s)=>{
      rows.push([state.current.name, new Date(s.clockIn).toLocaleDateString(), new Date(s.clockIn).toLocaleTimeString(),
        s.clockOut?new Date(s.clockOut).toLocaleTimeString():"IN PROGRESS", (shiftMs(s,Date.now())/3600000).toFixed(2)]);
    });
    downloadCSV(rows, "timesheet-"+state.current.name.replace(/\s+/g,"-").toLowerCase()+".csv");
  },

  async enterAdmin(){
    state.route="admin"; state.expanded=null; state.shiftEdit=null; render();
    await app.reloadAdmin();
  },
  async reloadAdmin(){
    try{
      const emps = await dbEmployees();
      const shifts = await dbAllShifts();
      state.employees = emps;
      const m={}; emps.forEach((e)=>m[e.id]=[]);
      shifts.forEach((s)=>{ if(!m[s.empId])m[s.empId]=[]; m[s.empId].push(s); });
      state.byEmp = m;
    }catch(e){ netErr(e); }
    try{ state.attempts = await dbAttempts(); state.attemptsOk = true; }
    catch(e){ state.attempts = []; state.attemptsOk = false; }
    if(state.route==="admin") render();
  },
  refreshAdmin(){ app.reloadAdmin(); },
  setPeriod(k){ state.period=k; render(); },
  setSecTab(k){ state.secTab=k; render(); },
  pickPhoto(){ const i=document.getElementById("js-photoinput"); if(i) i.click(); },
  async photoChosen(input){
    const f = input.files && input.files[0]; input.value="";
    if(!f || !state.current) return;
    try{
      const data = await fileToAvatar(f);
      await dbUpdateEmployee(state.current.id, { photo: data });
      state.current.photo = data;
      const e = state.employees.find((x)=>x.id===state.current.id); if(e) e.photo = data;
      render();
    }catch(err){ netErr(err); }
  },
  async removePhoto(id){
    try{
      await dbUpdateEmployee(id, { photo: null });
      const e = state.employees.find((x)=>x.id===id); if(e) e.photo = null;
    }catch(err){ netErr(err); }
    render();
  },
  toggleExpand(id){ state.expanded = state.expanded===id? null : id; state.shiftEdit=null; state.editErr=""; render(); },

  startName(id){ const e=state.employees.find((x)=>x.id===id); state.nameEditId=id; state.nameDraft=e?e.name:""; render(); },
  syncName(v){ state.nameDraft=v; },
  async saveName(id){
    const n=state.nameDraft.trim();
    state.nameEditId=null;
    if(n){
      try{ await dbUpdateEmployee(id,{name:n}); const e=state.employees.find((x)=>x.id===id); if(e)e.name=n; }
      catch(err){ netErr(err); }
    }
    render();
  },
  startRate(id){ const e=state.employees.find((x)=>x.id===id); state.rateEditId=id; state.rateDraft=e&&e.rate?String(e.rate):""; render(); },
  syncRate(v){ state.rateDraft=v.replace(/[^0-9.]/g,""); },
  async saveRate(id){
    const r=Math.max(0, parseFloat(state.rateDraft)||0);
    state.rateEditId=null;
    try{ await dbUpdateEmployee(id,{rate:r}); const e=state.employees.find((x)=>x.id===id); if(e)e.rate=r; }
    catch(err){ netErr(err); }
    render();
  },

  startShiftEdit(empId, shiftId){
    const s=(state.byEmp[empId]||[]).find((x)=>x.id===shiftId); if(!s)return;
    state.shiftEdit={empId, shiftId};
    state.inDraft=toLocalInput(s.clockIn);
    state.outDraft=s.clockOut!=null?toLocalInput(s.clockOut):"";
    state.editErr=""; render();
  },
  startAddShift(empId){
    const a=new Date(); a.setHours(9,0,0,0);
    const b=new Date(); b.setHours(17,0,0,0);
    state.shiftEdit={empId, shiftId:null};
    state.inDraft=toLocalInput(a.getTime());
    state.outDraft=toLocalInput(b.getTime());
    state.editErr=""; render();
  },
  syncIn(v){ state.inDraft=v; },
  syncOut(v){ state.outDraft=v; },
  cancelShiftEdit(){ state.shiftEdit=null; state.editErr=""; render(); },
  async saveShiftEdit(){
    if(!state.shiftEdit)return;
    const { empId, shiftId } = state.shiftEdit;
    const inTs = state.inDraft? new Date(state.inDraft).getTime() : NaN;
    if(!Number.isFinite(inTs)){ state.editErr="Enter a valid clock-in time."; render(); return; }
    let outTs=null;
    if(state.outDraft){
      outTs=new Date(state.outDraft).getTime();
      if(!Number.isFinite(outTs)){ state.editErr="Enter a valid clock-out time."; render(); return; }
      if(outTs<=inTs){ state.editErr="Clock-out must be after clock-in."; render(); return; }
    }
    const list = state.byEmp[empId]||[];
    if(outTs==null && list.some((s)=>s.clockOut==null && s.id!==shiftId)){ state.editErr="Another shift is already in progress."; render(); return; }
    try{
      if(shiftId==null){
        const s=await dbInsertShift(empId,inTs,outTs);
        state.byEmp[empId]=[s,...list];
      } else {
        await dbUpdateShift(shiftId,inTs,outTs);
        const s=list.find((x)=>x.id===shiftId); if(s){ s.clockIn=inTs; s.clockOut=outTs; }
      }
      state.shiftEdit=null; state.editErr="";
    }catch(e){ netErr(e); }
    render();
  },
  async deleteEditingShift(){
    if(!state.shiftEdit||state.shiftEdit.shiftId==null)return;
    if(!window.confirm("Delete this shift?"))return;
    const { empId, shiftId } = state.shiftEdit;
    try{
      await dbDeleteShift(shiftId);
      state.byEmp[empId]=(state.byEmp[empId]||[]).filter((s)=>s.id!==shiftId);
      state.shiftEdit=null;
    }catch(e){ netErr(e); }
    render();
  },
  exportPayroll(){
    const now=Date.now();
    const periodLabel=PERIODS.find((p)=>p.k===state.period).label;
    const rows=[["Employee","Pay Rate ($/hr)","Period","Regular Hours","Overtime Hours","Total Hours","Gross Pay ($)"]];
    let treg=0,tot=0,th=0,tp=0;
    state.employees.forEach((e)=>{
      const rate=Number(e.rate)||0;
      const bd=payBreakdown(state.byEmp[e.id]||[], state.period, now, rate);
      const reg=bd.regMs/3600000, ot=bd.otMs/3600000, hrs=bd.ms/3600000;
      treg+=reg; tot+=ot; th+=hrs; tp+=bd.pay;
      rows.push([e.name,rate.toFixed(2),periodLabel,reg.toFixed(2),ot.toFixed(2),hrs.toFixed(2),bd.pay.toFixed(2)]);
    });
    rows.push(["TOTAL","",periodLabel,treg.toFixed(2),tot.toFixed(2),th.toFixed(2),tp.toFixed(2)]);
    downloadCSV(rows,"payroll-"+state.period+".csv");
  },
};
window.app = app;
window.hashPin = hashPin;

function downloadCSV(rows, filename){
  const csv = rows.map((r)=>r.map((c)=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}

/* ---------- live ticking + admin polling ---------- */
setInterval(()=>{
  const now=Date.now();
  const ht=document.getElementById("js-headtime");
  if(ht) ht.textContent=new Date(now).toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
  const bt=document.getElementById("js-bigtimer");
  if(bt && state.current){ const act=activeShift(state.shifts); bt.textContent = act? fmtHMS(now-act.clockIn) : "00:00:00"; }
  const td=document.getElementById("js-today"); if(td && state.current) td.textContent=fmtDur(totalToday(state.shifts,now));
  const wk=document.getElementById("js-week"); if(wk && state.current) wk.textContent=fmtDur(totalWeek(state.shifts,now));
  document.querySelectorAll("[data-livedur]").forEach((n)=>{ n.textContent=fmtDur(now-Number(n.getAttribute("data-start"))); });
},1000);

setInterval(()=>{
  if(state.route==="admin" && !state.shiftEdit && !state.adminAdd && state.nameEditId==null && state.rateEditId==null){ app.reloadAdmin(); }
},30000);

/* ---------- physical keyboard input on PIN and code screens ---------- */
document.addEventListener("keydown", (ev)=>{
  const r = state.route;
  if(r!=="pin" && r!=="adminpin" && r!=="admincode") return;
  const t = ev.target;
  if(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.isContentEditable)) return;
  if(ev.key>="0" && ev.key<="9"){ app.press(ev.key); ev.preventDefault(); }
  else if(ev.key==="Backspace"){ app.del(); ev.preventDefault(); }
  else if(ev.key==="Escape"){ app.clearPin(); }
});

/* ---------- boot ---------- */
(function init(){
  if(!configured){ render(); return; }
  try{ sb = window.supabase.createClient(SUPABASE_URL.replace(/\/rest\/v1\/?$/,"").replace(/\/+$/,""), SUPABASE_ANON_KEY); }
  catch(e){ banner("Could not start the database client. Double-check the CONFIG values at the top of this file."); render(); return; }
  app.loadRoster();
})();
</script>
